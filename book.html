        <a href="about.html">About</a>

<section class="page-header">
    <h1>Request Service</h1>
    <p>Fill out the form below and we’ll contact you shortly.</p>
</section>

<section class="form-section">
    <form action="mailto:service@onpointhvac.com" method="POST" enctype="text/plain">
        <label>Name</label>
        <input type="text" name="Name" required>

        <label>Phone</label>
        <input type="text" name="Phone" required>

        <label>Address</label>
        <input type="text" name="Address" required>

        <label>Describe the Issue</label>
        <textarea name="Issue" required></textarea>

        <label>Preferred Date/Time</label>
        <input type="text" name="Preferred Time">

        <button type="submit" class="btn">Submit Request</button>
    </form>
</section>
